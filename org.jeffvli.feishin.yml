  - name: feishin
    buildsystem: simple
    subdir: main
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/run/build/feishin/bin
      env:
        HOME: /run/build/feishin
        XDG_CACHE_HOME: /run/build/feishin/flatpak-node/cache
        npm_config_cache: /run/build/feishin/flatpak-node/npm-cache
        npm_config_nodedir: /usr/lib/sdk/node24
        npm_config_offline: "true"
    build-commands:
      - chmod 755 ../pnpm
      - mkdir ../bin && mv ../pnpm ../bin/
      - pnpm install --loglevel debug --offline --frozen-lockfile --store-dir $npm_config_cache
      - npm ci --offline --cache=$FLATPAK_BUILDER_BUILDDIR/flatpak-node/npm-cache
      - |
        . ../flatpak-node/electron-builder-arch-args.sh
        npm run package:linux -- $ELECTRON_BUILDER_ARCH_ARGS  --linux --dir
      - >
        for i in 128x128 256x256 512x512; do
          install -Dm 644 dist/linux-unpacked/resources/assets/icons/${i}.png /app/share/icons/hicolor/${i}/apps/${FLATPAK_ID}.png
        done
      - cp -ar dist/linux-unpacked /app/main
      - install -Dm 644 ../flatpak/default.json /app/main/resources/default.json
      - install -Dm 644 ../flatpak/org.jeffvli.feishin.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm 644 ../flatpak/org.jeffvli.feishin.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm 755 ../feishin.sh /app/bin/feishin
    sources:
      - type: file
        url: https://github.com/pnpm/pnpm/releases/download/v10.18.2/pnpm-linux-x64
        dest-filename: pnpm
        subdir: main
        sha256: fe6261c86aba26c241dcbf514b011df77f4274d0556b96eaac19d44bb0a255ac
        only-arches:
          - x86_64
      - type: file
        path: package-lock.json
        dest: main
      - type: git
        url: https://github.com/jeffvli/feishin
        dest: main
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
        commit: b16e57710b28e4359b5f0f5c2528566dfad36827
        tag: v0.21.2
      - generated-sources.json
